<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets content span into notch/home-indicator areas
         on mobile devices, which is required for env(safe-area-inset-*)
         (read by systems/GameViewport.ts) to report non-zero values. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Arc Arcade</title>
    <style>
      /* Minimal shell styling only: centers the game canvas.
         No UI/HUD styling belongs here — that will live in src/ui. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        overflow: hidden;
      }

      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Phaser mounts its <canvas> inside this container (see main.ts). -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
